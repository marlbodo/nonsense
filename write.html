<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://aunukepmqpavuujypfks.supabase.co; base-uri 'none'; form-action 'self'">
  <meta name="robots" content="noindex">
  <title>글쓰기 - 헛소리 대마왕</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%98%88%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main class="container form-page">
    <h1>글쓰기</h1>
    <form id="write-form" novalidate>
      <div class="row2">
        <label class="field"><span>별명</span><input type="text" id="nickname" maxlength="20" required autocomplete="off"></label>
        <label class="field"><span>비밀번호 (4자 이상)</span><input type="password" id="password" minlength="4" maxlength="64" required autocomplete="new-password"></label>
      </div>
      <p class="hint">비밀번호는 글을 수정·삭제할 때 필요합니다. 분실하면 복구할 수 없어요.</p>
      <label class="field"><span>제목</span><input type="text" id="title" maxlength="100" required autocomplete="off"></label>
      <label class="field"><span>내용</span><textarea id="body" rows="12" maxlength="10000" required></textarea></label>
      <div class="counter" id="body-count">0 / 10000</div>
      <label class="field"><span>이미지 첨부 (선택, 1장 · 1MB 이하 · JPG/PNG/WebP)</span><input type="file" id="file" accept="image/jpeg,image/png,image/webp"></label>
      <div class="actions"><a class="btn" href="index.html">취소</a><button type="submit" class="btn primary" id="submit">등록</button></div>
      <div id="form-msg" class="form-msg" hidden role="alert"></div>
    </form>
  </main>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/write.js"></script>
</body>
</html>
