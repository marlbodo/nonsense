# GitHub Pages 배포: main 에 푸시할 때, 15분마다(새 글을 정적 페이지·사이트맵에 반영), 수동 실행 시.
name: deploy-pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: 사이트 빌드 (정적 글 페이지, sitemap, robots)
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ "$REPO" = "$OWNER.github.io" ]; then SITE_URL="https://$OWNER.github.io"; else SITE_URL="https://$OWNER.github.io/$REPO"; fi
          if [ -n "${{ vars.SITE_URL }}" ]; then SITE_URL="${{ vars.SITE_URL }}"; fi
          SITE_URL="$SITE_URL" node tools/build-seo.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
